name: MediaTagger
options:
  bundleIdPrefix: app.mediatagger
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  MediaTagger:
    type: application
    platform: macOS
    sources:
      - path: MediaTagger
        excludes:
          - "Resources/**"
      - path: MediaTagger/Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: MediaTagger/Info.plist
      properties:
        CFBundleName: MediaTagger
        CFBundleDisplayName: Media Tagger
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026"
        NSHighResolutionCapable: true
    entitlements:
      path: MediaTagger/MediaTagger.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mediatagger.MediaTagger
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: MediaTagger/MediaTagger.entitlements
  MediaTaggerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MediaTaggerTests
    dependencies:
      - target: MediaTagger
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MediaTagger.app/Contents/MacOS/MediaTagger"
