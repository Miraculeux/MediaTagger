name: MediaTagger
options:
  bundleIdPrefix: app.mediatagger
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  MediaTagger:
    type: application
    platform: macOS
    sources:
      - path: MediaTagger
        excludes:
          - "Resources/**"
      - path: MediaTagger/Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: MediaTagger/Info.plist
      properties:
        CFBundleName: MediaTagger
        CFBundleDisplayName: Media Tagger
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026"
        NSHighResolutionCapable: true
    entitlements:
      path: MediaTagger/MediaTagger.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mediatagger.MediaTagger
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: MediaTagger/MediaTagger.entitlements
        # Disable Xcode 16/17 "debug dylib" + Previews stub executor so the
        # Debug build produces a single regular Mach-O at
        #   MediaTagger.app/Contents/MacOS/MediaTagger
        # Without this the executable becomes a ~2 MB stub launched via a
        # host process; LLDB / `open -W` then can't tell when the app has
        # actually exited, and VS Code debug sessions appear to hang after
        # the window closes.
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_DEBUG_DYLIB_SUPPORT: NO
        ENABLE_PREVIEWS: NO
        ENABLE_XOJIT_PREVIEWS: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      # VLCKit is fetched on demand via Scripts/fetch_vlckit.sh and not
      # committed to the repo (it's ~400 MB extracted). When missing, the
      # XcodeGen `optional: true` flag silently skips the dependency and
      # the app falls back to AVFoundation-only playback.
      - framework: Frameworks/VLCKit.xcframework
        embed: true
        codeSign: true
        optional: true
  MediaTaggerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MediaTaggerTests
    dependencies:
      - target: MediaTagger
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MediaTagger.app/Contents/MacOS/MediaTagger"
